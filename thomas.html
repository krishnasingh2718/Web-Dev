<!DOCTYPE html>
<html>
<head>
  <title>My Prototype</title>
<link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f2;
      color: #050505;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 50px;
      border-bottom: 1px solid #704444;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    nav a {
      margin-left: 25px;
      text-decoration: none;
      color: #222;
    }

    .hero {
      max-width: 900px;
      margin: 100px auto;
      padding: 20px;
    }

    .hero h1 {
      font-size: 60px;
      line-height: 1;
      margin-bottom: 25px;
    }

    .hero p {
      font-size: 18px;
      color: #666;
      max-width: 550px;
      line-height: 1.6;
    }

    button {
      margin-top: 20px;
      padding: 14px 25px;
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
    }

    footer {
      padding: 30px 50px;
      border-top: 1px solid #ddd;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Krishna  </div>

    <nav>
      <a href="#">Work</a>
      <a href="#">About</a>
      <a href="#">Contact - 234567865</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Designing simple things that matter.</h1>

    <p>
      A small prototype inspired by a clean,
      editorial and minimal design style.
    </p>

    <button>View Work →</button>
  </section>

  <footer>
    © 2026 Krishna singh 
  </footer>

</body>
</html>
