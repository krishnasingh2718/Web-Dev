<!DOCTYPE html>
<html>
<head>
    <title>Corner to Corner Boxes</title>

    <style>

        body {
            margin: 0;
        }

        .container {
            width: 900px;
            height: 1000px;
            position: relative;
        }

        /* Blue/Green Box */
        .box1 {
            width: 460px;
            height: 460px;
            background-color: #66aaaa;
            border: 10px solid black;
            box-sizing: border-box;

            position: absolute;
            top: 10px;
            left: 10px;
        }

        /* Yellow Box */
        .box2 {
            width: 390px;
            height: 390px;
            background-color: #7b00ff;
            border: 10px solid black;
            box-sizing: border-box;

            position: absolute;
            top: 470px;
            left: 470px;
        }

        /* Red Box */
        .box3 {
            width: 390px;
            height: 390px;
            background-color: #5ccc90;
            border: 10px solid black;
            box-sizing: border-box;

            position: absolute;
            top: 860px;
            left: 80px;
        }

        /* Text */
        .box1 p {
            padding: 20px;
            font-size: 20px;
            font-family: Georgia, serif;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="box1">
            <p>
                My name is Krishhna singh.
            </p>
        </div>

        <div class="box2"></div>

        <div class="box3"></div>

    </div>

</body>
</html>
